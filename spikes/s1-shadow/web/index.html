<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Vitamine D – S1 shadow spike</title>
    <style>
      html, body, #map { margin: 0; height: 100%; font: 13px/1.35 system-ui, sans-serif; }
      #panel { position: absolute; z-index: 2; top: 8px; left: 8px; max-width: 330px; max-height: calc(100% - 16px); overflow-y: auto; box-sizing: border-box; padding: 10px 12px;
        background: rgba(255,255,255,.93); border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.25); }
      #panel label { display: block; margin: 4px 0; }
      #panel input[type=range] { width: 100%; }
      #panel button { margin-right: 6px; }
      #status, #sun, #perf { font-size: 11px; color: #333; margin-top: 4px; }
      .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
      #timeLabel { font-weight: 700; font-size: 18px; }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="panel">
      <div class="row"><input type="date" id="day" /> <span id="timeLabel"></span></div>
      <input type="range" id="time" min="0" max="1439" step="1" />
      <div class="row"><button id="now">Now</button><button id="play">Play</button><button id="bench">Benchmark</button></div>
      <div class="row">
        <label><input type="checkbox" id="showShadows" checked /> shadows</label>
        <label><input type="checkbox" id="showOrtho" /> aerial 2024</label>
        <label><input type="checkbox" id="debugHeight" /> height</label>
        <label><input type="checkbox" id="smooth" checked /> smoothing</label>
        <label><input type="checkbox" id="useMask" checked /> native-res mask</label>
      </div>
      <label>far-field exactness (lodScale) <span id="lodVal"></span><input type="range" id="lod" min="2" max="128" step="1" value="16" /></label>
      <label>bias (×0.25 m) <span id="biasVal"></span><input type="range" id="bias" min="0" max="12" step="1" value="2" /></label>
      <label>opacity <span id="alphaVal"></span><input type="range" id="alpha" min="0.1" max="0.9" step="0.05" value="0.5" /></label>
      <label>smoothing strictness <span id="edgeVal"></span><input type="range" id="edge" min="0.3" max="0.8" step="0.05" value="0.5" /></label>
      <div id="sun"></div>
      <div id="perf"></div>
      <div id="benchResult" style="font-weight:700;color:#0a5"></div>
      <div id="status"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
